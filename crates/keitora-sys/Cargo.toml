[package]
name = "keitora-sys"
description = "Keitora's Win32 wrappers: the only crate allowed to contain unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Only the API families of the functions wrapped here (ADR-0012). Add one
# when you add a wrapper that needs it.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_WindowsProgramming",
] }
# Only for `named_pipe`: creating a tokio pipe server with a security
# descriptor is an `unsafe` tokio call, so it lives here (ADR-0012).
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
