[package]
name = "keitora-sys"
description = "Keitora's Win32 wrappers: the only crate allowed to contain unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Only the API families of the functions wrapped here (ADR-0012). Add one
# when you add a wrapper that needs it.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_WindowsProgramming",
] }

[lints]
workspace = true
