[package]
name = "keitora-service"
description = "Keitora Windows service: holds the session state, blocks applications and serves IPC clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The service's code lives in a library, `keitora_service`, so that it can be
# tested without starting the binary; `src/main.rs` only picks the mode.
[lib]
name = "keitora_service"

[dependencies]
keitora-core.workspace = true
keitora-ipc.workspace = true
keitora-sys.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# One current-thread runtime for the pipe server: `sync` for its channels and
# semaphore, `macros` for `select!`, `net` and `io-util` for the pipe, `time`
# for the rate limit.
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
windows-service.workspace = true

[lints]
workspace = true
