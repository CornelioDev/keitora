version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      rust-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directories: ["/apps/desktop", "/extension"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      npm-minor:
        update-types: ["minor", "patch"]
    ignore:
      # `@types/node` follows the Node version CI runs (`node-version` in
      # `.github/workflows/ci.yml`). A newer major would type APIs that don't
      # exist at runtime, so it moves by hand, together with that version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # `@unovis/vue` 1.8.0 emits directory imports of `@unovis/ts` subpaths
      # without `/index.js` (f5/unovis#876), which Node's ESM resolver
      # rejects, so importing the `chart` component fails under Vitest. Both
      # packages must move together, so both wait for a fixed 1.8.x.
      - dependency-name: "@unovis/ts"
        versions: ["1.8.x"]
      - dependency-name: "@unovis/vue"
        versions: ["1.8.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      # Every `github/codeql-action` step in a workflow must use the same
      # version, or the job fails; `init`, `analyze` and `upload-sarif` move
      # together.
      codeql-action:
        patterns: ["github/codeql-action", "github/codeql-action/*"]
