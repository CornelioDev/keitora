# Cargo workspace for Keitora's Rust crates. AGENTS.md ("Repository layout")
# and docs/architecture.md describe what each crate does.

[workspace]
members = [
    "crates/keitora-core",
    "crates/keitora-ipc",
    "crates/keitora-sys",
    "crates/keitora-service",
    "crates/keitora-nmh",
    "apps/desktop/src-tauri",
]
# A workspace root without a [package] has no edition, so the resolver is set
# explicitly. Resolver 3 (the edition 2024 default) prefers dependency versions
# that support our `rust-version`.
resolver = "3"

# Metadata shared by every crate, inherited with `<field>.workspace = true`.
[workspace.package]
# Set by release-please, along with Cargo.lock (release-please-config.json); don't
# edit it by hand. Nothing is released yet, and the first release is v0.1.0-beta.1;
# starting at 0.1.0 would make it look like a downgrade.
version = "0.0.0"
edition = "2024"
# Minimum supported Rust version: the minor version of the toolchain pinned in
# rust-toolchain.toml, which is the only version CI tests. Bump both together.
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CornelioDev/keitora"
# Keitora ships as an application, not as crates on crates.io.
publish = false

# Dependency versions, set once for the workspace and used with
# `<name>.workspace = true`.
[workspace.dependencies]
# WHATWG URL parsing, with IDNA (UTS #46) for hosts: the site rule matcher in
# keitora-core parses URLs as a browser does. `std` is its whole default set,
# named here so that a new default feature isn't picked up unnoticed.
url = { version = "2.5.8", default-features = false, features = ["std"] }

# Our own crates, used by path. They are never published, so they have no
# version, and Cargo.lock lists them without a `source`.
keitora-core = { path = "crates/keitora-core" }
keitora-sys = { path = "crates/keitora-sys" }

# Error types in libraries (AGENTS.md, "Conventions").
thiserror = "2.0.21"

# Win32 bindings, used only by keitora-sys (ADR-0012). The 0.61 line is the
# one windows-service uses, so there is a single copy. Each crate turns on
# only the API families it calls.
windows-sys = { version = "0.61.2", default-features = false }
# Talks to the Service Control Manager for keitora-service: the dispatcher,
# the control handler and status reports. It has no features.
windows-service = "0.8.1"

# Logging. `std` only: no `attributes` (the `#[instrument]` macro and its
# proc-macro dependencies).
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# The formatter that writes log lines. `fmt` and `std` only: no colors
# (`ansi`), no bridge from the `log` crate (`tracing-log`), no `smallvec`.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
# Daily log files. Its only feature, `parking_lot`, is off.
tracing-appender = "0.2.5"

[profile.release]
# Integer overflow panics, as in debug builds, instead of silently wrapping:
# a wrapped value in, say, the remaining-time calculation could shorten a
# strict session.
overflow-checks = true
# Unwinding (the default, stated on purpose) lets a failing task, such as one
# client connection, end on its own; `panic = "abort"` would take down the
# whole service.
panic = "unwind"

# Lints shared by every crate, inherited with `[lints] workspace = true`.
# Most are warnings so that local builds keep working while you iterate;
# `just check` runs clippy with `-D warnings`, which turns them into errors.
# Silencing one needs a reason: `#[allow(lint_name, reason = "...")]`.
[workspace.lints.rust]
# Public items are documented (AGENTS.md, "Conventions").
missing_docs = "warn"
# Public types implement `Debug` (Rust API Guidelines, C-DEBUG).
missing_debug_implementations = "warn"
# `unsafe` is only allowed in the keitora-sys crate, which opts in with a
# crate-level `#![allow(unsafe_code, reason = "...")]` (AGENTS.md, "Hard
# rules"; ADR-0012). It is an error rather than a warning so that even `cargo
# build` rejects it. Every other crate (keitora-core, keitora-ipc,
# keitora-service, keitora-nmh and keitora-desktop) goes further with
# `#![forbid(unsafe_code)]`, which no `#[allow]` can override.
unsafe_code = "deny"
# Idioms such as writing `Formatter<'_>` so that borrows are visible.
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# No `unwrap()` / `expect()` outside tests (AGENTS.md, "Conventions").
# clippy.toml allows them in tests.
unwrap_used = "warn"
expect_used = "warn"
# No other operations that can panic, overflow, truncate or end the process.
# A panic in the service is a denial of service (docs/threat-model.md), and
# keitora-core and keitora-ipc run inside it. Use `Result`, `.get()`,
# `checked_*` / `saturating_*` arithmetic and `try_from` instead.
# clippy.toml relaxes `panic` and `indexing_slicing` in tests.
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
exit = "warn"
indexing_slicing = "warn"
string_slice = "warn"
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"
# Every `unsafe` block contains one operation and a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
# Public functions document when they fail or panic (Rust API Guidelines,
# C-FAILURE).
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Every silenced lint says why.
allow_attributes_without_reason = "warn"
# No leftover debugging output.
dbg_macro = "warn"
